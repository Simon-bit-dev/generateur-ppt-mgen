      PH24: "Commençons par préciser le cadre, les objectifs et les besoins du groupe."
  - slide_id: "S06"
    numero: 6
    partie: "Accueil et objectifs"
    layout_code: "MGEN-06"
    layout_name_exact: "liste objectifs"
    statut: "variable"
    placeholders:
      PH24: |
        Définir ce qu’est le yoga sur chaise et en préciser les limites
        Repérer les effets d’une posture assise maintenue trop longtemps
        Adopter une installation stable et confortable
        Réaliser des mouvements et des respirations simples sans forcer
        Construire une micro-pause adaptée à son activité
      PH25: "{{GLOBAL_FOOTER_LEFT}}"
      PH26: "{{GLOBAL_FOOTER_RIGHT}}"
  - slide_id: "S07"
    numero: 7
    partie: "Accueil et objectifs"
    layout_code: "MGEN-07"
