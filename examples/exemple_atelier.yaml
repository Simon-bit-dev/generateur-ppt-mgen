    statut: "variable"
    placeholders:
      PH24: "À quel moment de la journée ressentez-vous le plus le besoin de bouger ?"
      PH25: "Répondez en un mot ou choisissez le matin, le milieu de journée ou la fin de journée."
      PH26: "{{GLOBAL_FOOTER_LEFT}}"
